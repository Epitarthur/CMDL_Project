name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: cmdl
          POSTGRES_PASSWORD: cmdl-ci-only
          POSTGRES_DB: cmdl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmdl -d cmdl_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      CMDL_TEST_DSN: postgresql://cmdl:cmdl-ci-only@localhost:5432/cmdl_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run cmdl profile
      - name: Verify Docker services, persistence and reset
        run: uv run python scripts/smoke_compose.py
