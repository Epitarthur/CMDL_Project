[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cmdl"
version = "0.1.0"
description = "Deskdrop recommendation and metadata quality evaluation"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
cmdl = "cmdl.cli:main"

[dependency-groups]
dev = [
    "jsonschema[format]==4.25.1",
    "openapi-spec-validator==0.7.2",
    "pytest==8.4.2",
    "ruff==0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
